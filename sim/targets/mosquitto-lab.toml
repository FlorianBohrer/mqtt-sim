# Target profile for the ENTC-63 acceptance harness: the lab's Mosquitto broker.
#
# For another broker candidate (ENTC-59): copy this file, point host/port at the
# broker, configure that broker from synthetic/fleet.json (trust the lab CA, map
# certificate CN to identity, one ACL rule set per gateway / service) and adapt
# the log patterns below. The tests themselves stay unchanged.

name = "Mosquitto lab broker"
status = "verified"           # verified | template (patterns/settings not yet confirmed)
lab_managed = true            # make acceptance starts it via docker compose
host = "localhost"            # seen from the Mac; --host / SIM_BROKER_HOST override
compose_host = "broker"       # seen from the sim container (compose service name)
compose_service = "broker"    # docker compose service started by make acceptance
ready_log = 'running'         # log line that shows the broker is ready
port = 8883                   # --port / SIM_BROKER_PORT override
# server_ca = "certs/ca/ca.crt"  # CA that signed the broker's server cert (default: lab CA)
observe_s = 3.0               # how long a delivery that must NOT happen is watched
session_expiry_s = 300        # Session Expiry Interval used by the session tests
reconnect_gateways = 10       # gateways dropped at once in REC-01
reconnect_window_s = 5.0      # full-jitter window for their first reconnect attempt

[log]
# Regular expressions applied to the broker log captured for the run window.
# `timestamp` must capture Unix seconds; lines outside the run window are ignored.
timestamp = '(\d{10}):'
connect_accepted = '''New client connected from \S+ as \S+ \(.*u'[^']+'\)'''
auth_failure = 'OpenSSL Error|certificate verify failed|peer did not return a certificate'
acl_denied = 'Denied (PUBLISH|SUBSCRIBE)'
disconnect = 'Client \S+ (disconnected|closed its connection)|already connected, closing old connection'

[effort]
# Lab assessment per requirement: CLASS | note. Classes: NATIVE, CONFIGURATION, PLUGIN,
# EXTERNAL SERVICE, CUSTOM DEVELOPMENT, UNSUPPORTED. Based on the observed acceptance results.
R01 = "CONFIGURATION | require_certificate, cafile"
R02 = "CONFIGURATION | require_certificate"
R03 = "CONFIGURATION | cafile"
R04 = "CONFIGURATION | validity checked; revocation needs crlfile (not set in lab config)"
R05 = "CONFIGURATION | use_identity_as_username + acl_file"
R06 = "UNSUPPORTED | CN == Client ID not enforced (ID-01 FAIL); custom plugin untested"
R07 = "CONFIGURATION | acl_file; denied SUBSCRIBE is not signalled (PARTIAL)"
R08 = "CONFIGURATION | acl_file"
R09 = "CONFIGURATION | acl_file; denied SUBSCRIBE is not signalled (PARTIAL)"
R10 = "CONFIGURATION | acl_file; denied SUBSCRIBE is not signalled (PARTIAL)"
R11 = "UNSUPPORTED | session takeover (DUP-01 FAIL); custom plugin untested"
R12 = "NATIVE | MQTT 5 QoS 1"
R13 = "NATIVE | persistent sessions"
R14 = "NATIVE | sessions survive; backoff is a client matter"
R15 = "CONFIGURATION | log_type, connection_messages"
R16 = "UNSUPPORTED | certificate without CN has no identity (LEG-01 FAIL)"
R17 = "CONFIGURATION | two certificates for one CN work"
