# Broker profile: HiveMQ CE 2026.5 + ENETEC identity extension (candidate, ENTC-59).
# make acceptance BROKER=hivemq builds brokers/hivemq (Dockerfile: Maven build of the
# extension + HiveMQ CE), creates the keystore and starts compose service "hivemq".
# HiveMQ CE has no ACLs of its own: identity, Client ID binding, duplicate rejection,
# revocation and topic permissions come from brokers/hivemq/extension (open source, lab).

name = "HiveMQ CE 2026.5 + enetec-identity extension"
status = "verified"
lab_managed = true
compose_service = "hivemq"
ready_log = 'Started HiveMQ'
image_build = "brokers/hivemq"        # docker build context
image = "enetec-hivemq:local"
prepare_script = "brokers/hivemq/prepare_keystore.sh"   # runs in the sim container
host = "localhost"
port = 8885                   # host port mapped to the container's 8883
compose_host = "hivemq"
compose_port = 8883
observe_s = 3.0
session_expiry_s = 300
reconnect_gateways = 10
reconnect_window_s = 5.0

[log]
# Lines like "2026-10-01 08:34:00,834 INFO  - ENETEC-AUDIT connect-accepted ..." (container UTC)
timestamp = '(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})'
connect_accepted = 'ENETEC-AUDIT connect-accepted clientId=\S+ identity=\S+'
auth_failure = 'ENETEC-AUDIT connect-rejected|SSL|TLS handshake|certificate'
acl_denied = 'ENETEC-AUDIT (publish|subscribe)-denied'
disconnect = 'ENETEC-AUDIT disconnect'

[effort]
# Lab assessment per requirement: CLASS | note. Based on the observed acceptance results.
R01 = "CONFIGURATION | tls-tcp-listener, truststore"
R02 = "CONFIGURATION | client-authentication-mode REQUIRED"
R03 = "CONFIGURATION | truststore"
R04 = "CUSTOM DEVELOPMENT | CRL check in the extension; validity is native"
R05 = "CUSTOM DEVELOPMENT | CE has no ACL; extension maps CN to permissions"
R06 = "CUSTOM DEVELOPMENT | enforced in the extension (Enterprise Security Extension: unverified)"
R07 = "CUSTOM DEVELOPMENT | permissions.tsv in the extension"
R08 = "CUSTOM DEVELOPMENT | extension"
R09 = "CUSTOM DEVELOPMENT | extension"
R10 = "CUSTOM DEVELOPMENT | extension"
R11 = "CUSTOM DEVELOPMENT | isClientConnected check in the extension"
R12 = "NATIVE | MQTT 5 QoS 1"
R13 = "NATIVE | persistent sessions"
R14 = "NATIVE | sessions survive; backoff is a client matter"
R15 = "CUSTOM DEVELOPMENT | ENETEC-AUDIT lines from the extension; TLS rejections not logged by default"
R16 = "CUSTOM DEVELOPMENT | fingerprint registry in the extension"
R17 = "CONFIGURATION | two certificates for one CN work"
