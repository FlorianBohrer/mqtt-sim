# Synthetische ENETEC-Flotte und Datenverkehr fuer das mTLS-Lab.
#
# Kennzeichnung wie in ENETEC.md:
#   SOURCE      = aus Projektunterlagen (EICP-Zusammenfassung, MQTT Current State,
#                 Mental Model v1.0, bestehendes Lab)
#   INTERPRETED = daraus abgeleitet, nicht bestaetigt
#   ASSUMPTION  = reine Lab-Annahme fuer die Simulation
# Massgeblich fuer Nachrichtensemantik bleibt ENTC-61 / EICP v1.4.
# Nach jeder Aenderung neu erzeugen: make fleet (siehe docs/mqtt-tests/synthetic-simulation.md)

seed = 20260930

[wire]
# Welches Draht-Profil das Lab spricht (Erklaerung: sim/enetec_sim/wire.py).
# Umschalten ohne Dateiaenderung: make acceptance WIRE=lab-eicp  (SIM_WIRE)
#   v13      SOURCE (MQTT wire contract v1.3, 06.10.2026): enetec/v1/{clientId}/state|cmd, QoS 1, kein Retain
#   lab-eicp frueheres Lab-Fixture eicp/v1/sim/{plantId}/gateways/{gatewayId}/d2c|c2d/... (Kompatibilitaet)
topics = "v13"
# derived     SOURCE (ENTC-47): Client ID = deterministisches Pseudonym der Gateway-Seriennummer
# certificate LEGACY LAB ASSUMPTION: Client ID = Zertifikats-CN = Gateway-ID
client_id = "derived"
# ASSUMPTION / Platzhalter: der echte Ableitungs-Algorithmus ist OFFEN (ENTC-47).
client_id_algorithm = "lab-sha256-v0"

[topics_v13]
# SOURCE: MQTT wire contract v1.3 (Kern). telemetry ist optional/zukuenftig und nicht freigegeben.
base = "enetec/v1"
state = "state"
cmd = "cmd"

[topics]
# Profil lab-eicp. SOURCE (EICP v1.4, Stand 30.09.):
# eicp/v1/{environment}/{plantId}/gateways/{gatewayId}/{direction}/{domain}/{operation}
base = "eicp/v1/sim"
# Blatt-Topics unter d2c/ bzw. c2d/. ASSUMPTION: neutraler Lab-Namespace, keine EICP-Command-Semantik.
telemetry = "telemetry/report"
command = "simulation/command"

[fleet]
plants = 6
# INTERPRETED: Wohnanlagen mit einem Gateway, Gewerbeobjekte mit mehreren.
plant_types = { residential = 0.7, commercial = 0.3 }
gateways_per_plant = { residential = [1, 1], commercial = [2, 3] }
# Bestehende Lab-Gateways/-Plants bleiben unveraendert, damit Skripte 04-10 passen.
# Weitere Plants erhalten die kanonische Form plt_<UUIDv7> (SOURCE: EICP).
pinned = [
  { gateway_id = "gw-sim-000001", plant_id = "plt_sim_001" },
  { gateway_id = "gw-sim-000002", plant_id = "plt_sim_002" },
]
# SOURCE (Mental Model v1.0): Gateway-Typen. Verteilung: ASSUMPTION.
gateway_families = { "SmartComfort365" = 0.6, "Pure365 Bridge" = 0.4 }
# INTERPRETED (Mental Model v1.0): Systemregler, Raumgeraete, I/O-Module je Gateway.
room_devices_per_gateway = { residential = [3, 8], commercial = [6, 16] }
io_modules_per_gateway = [0, 2]
# ASSUMPTION: Anteil Gateways mit instabiler Anbindung (Funk/LTE statt Ethernet).
flaky_link_share = 0.25
clock_skew_s = [-3.0, 3.0]

[legacy]
# SOURCE (ENETEC, Test-Gateway 0000000000000005): Legacy-Zertifikate aus AWS IoT Fleet
# Provisioning haben RSA 2048, Subject nur "C=UK, ST=United", KEIN CN/SAN -> die
# Gateway-ID steht nicht im Zertifikat (AWS: Zuordnung ueber die Thing-Registry).
# Die Lab-Kopien werden von der Lab-CA signiert (AWS-CA nicht nachgebildet).
# Sie sind NICHT Teil des Simulations-Datensatzes, nur der Acceptance-Faelle LEG-*.
plant_id = "plt_sim_legacy"
gateway_ids = ["0000000000000005", "0000000000000006"]
subject = "/C=UK/ST=United"
key = "rsa:2048"
# Rotation (ROT-*): zweites, per CSR "auf dem Geraet" erzeugtes Zertifikat fuer dieses Gateway.
rotation_gateway = "gw-sim-000001"

[services]
# Cloud-Platzhalter; spaeter durch die MQTT->Pub/Sub-Bridge ersetzt.
ingest = "svc-sim-cloud-ingest"
command = "svc-sim-cloud-command"

[dataset]
start = "2026-10-01T00:00:00Z"   # Donnerstag; 24 h decken einen Tagesgang ab
duration_s = 86400
utc_offset_h = 2
# SOURCE (Planungswert): ~2.51 Mio. D2C/Tag bei ~10.000 Gateways = ~251 je Gateway.
# Der Generator leitet daraus das Meldeintervall der Raumgeraete ab. Welcher Anteil
# davon Telemetrie vs. State/Heartbeat/Event ist, ist OFFEN (EICP v1.4).
d2c_per_gateway_per_day = 251
interval_jitter_s = 5.0

[baseline]
# SOURCE (Planungswerte): nur Vergleichswerte fuer summary.json, steuern nichts.
avg_payload_bytes = 500
max_payload_bytes = 12000

[climate]
# Plausibles Raumklima fuer die Felder aus samples/telemetry.json. Keine ENETEC-Messdaten.
setpoint_c = [20.0, 22.0]
base_rh_pct = [38.0, 52.0]
occupancy = [0.4, 1.0]
co2_gain_ppm = [400, 1000]
co2_outdoor_ppm = 420

[connectivity]
# ASSUMPTION: zufaellige Ausfaelle je Anbindungstyp.
outages_per_h = { stable = 0.02, flaky = 0.5 }
outage_duration_s = [20, 900]
# ASSUMPTION (EICP: exponentieller Backoff + Jitter, Werte OFFEN): Verzoegerung des
# ersten erfolgreichen Reconnects nach Rueckkehr des Netzes.
reconnect_jitter_s = [0.5, 30.0]
# ASSUMPTION: Offline-Puffer im Gateway; Ueberlauf verwirft die aeltesten Nachrichten.
buffer_max_messages = 50
backlog_flush_per_s = 10
# ASSUMPTION: Anteil der Ausfaelle, die eine noch unbestaetigte QoS-1-Nachricht treffen
# (Netzabbruch direkt nach PUBLISH, vor PUBACK) -> Neuzustellung mit DUP nach Reconnect.
inflight_drop_share = 0.3

# Geplante Ereignisse fuer die Edge-Cases aus "MQTT Current State", Abschnitt 10.
[[connectivity.incidents]]
name = "regional-isp-outage"      # Reconnect-Sturm: viele Gateways gleichzeitig zurueck
start_s = 45000
duration_s = 900
share = 0.5
[[connectivity.incidents]]
name = "overnight-outage"         # langer Ausfall: Pufferueberlauf, persistente Session
start_s = 72000
duration_s = 14400
select = "largest"
count = 1

[commands]
per_gateway_per_h = 0.25
# Je Ausfall ein Command mitten im Ausfall: prueft die Zustellung ueber die
# persistente Session nach dem Reconnect (Clean Start = false).
during_outage = true

[mqtt]
keepalive_s = 120                 # SOURCE: Planungswert
session_expiry_s = 3600           # ASSUMPTION: Wert OFFEN
