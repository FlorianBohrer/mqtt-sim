# Gewichtete Entscheidungsmatrix fuer die Broker-Auswahl (ENTC-59): make decide
#
# Die Matrix trifft keine Entscheidung, sie macht sie nachvollziehbar:
#   - security_acceptance wird aus dem letzten Acceptance-Lauf je Broker-Profil berechnet,
#   - development_effort aus den Aufwandsklassen [effort] des Profils, sofern hier kein
#     belegter Wert steht,
#   - alle anderen Kriterien sind Handbewertungen und brauchen eine Quelle.
# Ein fehlender Wert zaehlt NICHT als 0, sondern als OFFEN. Solange bei einem Kandidaten der
# Shortlist Gewicht offen ist, nennt make decide keinen Favoriten.
#
# Kennzeichnung wie in ENETEC.md: SOURCE = belegt (Quelle angeben), ASSUMPTION = Annahme.
# Skala 0..5 (5 = am besten).

[weights]
# ASSUMPTION: Vorschlag des Labs, mit SOLHEA/ENETEC abzustimmen. Werden auf 100 % normiert.
security_acceptance = 35   # ENTC-63 Pflichtfaelle (Harness)
development_effort  = 20   # noetige Eigenentwicklung fuer Standard-Anforderungen
operations_ha       = 15   # HA/Cluster, Betrieb, Monitoring
scale               = 10   # ~15.000 gleichzeitige Verbindungen (Lasttest)
gcp_integration     = 10   # Broker -> GCP Pub/Sub
vendor_support      = 5    # Erreichbarkeit/Support des Anbieters
cost                = 5    # Lizenz + Betrieb

[labels]
security_acceptance = "Security acceptance (ENTC-63 mandatory cases)"
development_effort = "Custom development needed for standard requirements"
operations_ha = "HA / clustering / operations"
scale = "Scale: ~15,000 concurrent connections"
gcp_integration = "GCP Pub/Sub integration"
vendor_support = "Vendor responsiveness / support"
cost = "Cost (license and operations)"

# Kandidaten. profile = Broker-Profil in sim/targets/ (fuer die berechneten Kriterien).
# shortlist = false: wird angezeigt, aber nicht gerankt.
[candidates.emqx]
name = "EMQX"
profile = "emqx"
shortlist = true   # SOURCE: Current State 08.10 §9, fuehrender Kandidat fuer den weiteren PoC

[candidates.cedalo]
name = "Cedalo / Pro Mosquitto"
profile = "cedalo"
shortlist = true   # SOURCE: Current State 08.10 §9 (unabhaengiger Benchmark); 12.10.: HiveMQ und Bevywise gestrichen, Cedalo bleibt neben EMQX
# Handbewertungen bewusst offen: Die Herstellerangaben (brokers/cedalo/README.md, z. B. Google-Pub/Sub-Bridge,
# HA-Cluster ab 3 Knoten, Cloud-Preise) sind recherchiert, aber nicht im Lab geprueft. Bewertung durch ENETEC.

[candidates.mosquitto-lab]
name = "Mosquitto 2.0 (lab baseline)"
profile = "mosquitto-lab"
shortlist = false  # Referenz des Labs, kein Anbieter-Kandidat
