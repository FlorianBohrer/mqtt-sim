# Quellen fuer die Baukasten-Webseite (web/baukasten/index.html), eingebaut mit `make web`.
#
# Die Seite zeigt Broker-Verhalten nur so, wie es im Lab gemessen wurde. Jeder Lauf hier muss
# als Datei im Repo liegen. Neuer Referenzlauf: Bericht nach docs/mqtt-tests/reference/ legen,
# hier eintragen, `make web` ausfuehren. Keine Ergebnisse von Hand eintragen.
#
# kind = "report"   report.md des Harness (Tabelle "## Cases"): Ergebnis und Beobachtung je Fall
# kind = "summary"  nur die Zusammenfassung (summary.txt / Terminal-Ausgabe): Ergebnis je Fall,
#                   keine Beobachtung. `cases` nennt alle Faelle, die der Lauf enthielt; was dort
#                   weder unter "Not passed" noch unter "Advisory" steht, war PASS.

[brokers.mosquitto-lab]
name = "Mosquitto 2.0"
role = "Lab-Referenz"
note = "Open-Source-Broker der Lab-Basis. Kein Anbieter-Kandidat; Cedalo / Pro Mosquitto ist die kommerzielle Variante und wurde nicht getestet."

[brokers.emqx]
name = "EMQX 5.8"
role = "Kandidat (führend)"
note = "Laut Current State 08.10. der führende Kandidat für den weiteren PoC. Im v1.3-Profil noch nicht gemessen."

[brokers.hivemq]
name = "HiveMQ CE + Lab-Erweiterung"
role = "Referenz, nicht mehr verfolgt"
note = "HiveMQ CE hat keine eigene Autorisierung; alle Sicherheitsfunktionen kommen aus der Lab-Erweiterung (Eigenentwicklung). Der Anbieter hat nicht geantwortet. Lab-Ergebnis, keine Produktabnahme."

[brokers.bevywise]
name = "Bevywise MQTTRoute"
role = "Kandidat (Alternative)"
note = "Keine Instanz verfügbar, daher nicht gemessen. Anbieterschätzung: 4–6 Wochen Zusatzentwicklung für Zertifikatszuordnung, Widerruf und dynamische Autorisierung (Current State 08.10.)."

[[run]]
broker = "mosquitto-lab"
wire = "v13"
date = "2026-10-08"
kind = "report"
file = "docs/mqtt-tests/reference/2026-10-08-mosquitto-2.0.18-v13.md"
label = "Mosquitto 2.0.18, lokal, Hooks über SIM_HOOK_*"

[[run]]
broker = "hivemq"
wire = "v13"
date = "2026-10-08"
kind = "report"
file = "docs/mqtt-tests/reference/2026-10-08-hivemq-ce-2026.5-v13.md"
label = "HiveMQ CE 2026.5 + Erweiterung, lokal"

[[run]]
broker = "hivemq"
wire = "lab-eicp"
date = "2026-10-08"
kind = "report"
file = "docs/mqtt-tests/reference/2026-10-08-hivemq-ce-2026.5-lab-eicp.md"
label = "HiveMQ CE 2026.5 + Erweiterung, lokal"

[[run]]
broker = "emqx"
wire = "lab-eicp"
date = "2026-10-01"
kind = "summary"
file = "docs/mqtt-tests/reference/2026-10-01-emqx-5.8.6-summary.txt"
label = "EMQX 5.8.6, Docker-Lab (macOS), nur Zusammenfassung"
cases = ["MTLS-01", "MTLS-02", "MTLS-03", "MTLS-04", "MTLS-05", "MTLS-06", "MTLS-07", "MTLS-08",
         "ID-01", "ID-02", "DUP-01",
         "ACL-01", "ACL-02", "ACL-03", "ACL-04", "ACL-05", "ACL-06", "ACL-07", "ACL-08", "ACL-09",
         "ACL-10", "ACL-11", "ACL-12", "ACL-13",
         "QOS-01", "QOS-02", "SES-01", "SES-02", "REC-01",
         "LEG-01", "LEG-02", "ROT-01", "ROT-02",
         "LOG-01", "LOG-02", "LOG-03", "LOG-04", "LOG-05"]

[[run]]
broker = "mosquitto-lab"
wire = "lab-eicp"
date = "2026-09-30"
kind = "report"
file = "docs/mqtt-tests/reference/2026-09-30-mosquitto-2.0.18.md"
