<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENETEC MQTT-Baukasten</title>
<meta name="description" content="Interaktiver Baukasten für die ENETEC MQTT-Simulation: Gateways, Broker und Cloud zusammenstecken, Szenarien auslösen und sehen, wie sich die Broker im Lab verhalten haben.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Schaltschrank. Links die Bausteinleiste, in der Mitte die Montageplatte
   (Feld → Broker → Cloud, verdrahtet), rechts Inspektor und Prüfprotokoll, darunter das Pult mit Reitern. */
:root {
  --bg: #e4e7e3;            /* RAL 7035 Lichtgrau, leicht grünstichig */
  --plate: #eef0ec;         /* Montageplatte */
  --panel: #f7f8f5;
  --module: #ffffff;
  --ink: #1b2226;
  --muted: #586368;
  --line: #c3c9c4;
  --rail: #a3aba7;
  --accent: #1f5ba6;        /* Signalblau */
  --accent-ink: #ffffff;
  --accent-soft: #dde7f4;
  --wire-state: #1f5ba6;    /* Gerät → Cloud: blau */
  --wire-cmd: #8a5a2e;      /* Cloud → Gerät: braun */
  --pass: #2c7a4b;
  --pass-soft: #dcefe3;
  --fail: #b1261c;
  --fail-soft: #f8dedb;
  --warn: #9a5c00;
  --warn-soft: #f6e8cf;
  --na: #66727a;
  --na-soft: #e6e9e7;
  --shadow: rgba(27, 34, 38, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191b; --plate: #1a2023; --panel: #1d2427; --module: #242c30; --ink: #e5ebe8; --muted: #9aa6a9;
    --line: #353f44; --rail: #4c575c; --accent: #79a7e6; --accent-ink: #0f1a26; --accent-soft: #233548;
    --wire-state: #79a7e6; --wire-cmd: #cf9a66; --pass: #63c48d; --pass-soft: #1f3a2b; --fail: #ff8577;
    --fail-soft: #43221f; --warn: #eeaa4a; --warn-soft: #3e301a; --na: #9aa6a9; --na-soft: #2a3236;
    --shadow: rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191b; --plate: #1a2023; --panel: #1d2427; --module: #242c30; --ink: #e5ebe8; --muted: #9aa6a9;
  --line: #353f44; --rail: #4c575c; --accent: #79a7e6; --accent-ink: #0f1a26; --accent-soft: #233548;
  --wire-state: #79a7e6; --wire-cmd: #cf9a66; --pass: #63c48d; --pass-soft: #1f3a2b; --fail: #ff8577;
  --fail-soft: #43221f; --warn: #eeaa4a; --warn-soft: #3e301a; --na: #9aa6a9; --na-soft: #2a3236;
  --shadow: rgba(0, 0, 0, 0.35); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 1680px; margin: 0 auto; padding-inline: clamp(16px, 2.4vw, 32px); padding-block: 18px 48px; display: grid; gap: 16px; }

/* ---------- Kopf */
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 28px; }
.brand { display: grid; gap: 2px; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1; letter-spacing: 0.01em; }
.datasource { color: var(--muted); font-size: 13px; margin: 2px 0 0; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 7px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.label-sm { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* ---------- Werkbank */
.workbench { display: grid; grid-template-columns: 220px minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
@media (max-width: 1240px) { .workbench { grid-template-columns: 210px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; } }
@media (max-width: 780px) { .workbench { grid-template-columns: minmax(0, 1fr); } }

.palette { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 780px) { .palette { position: static; } }
.palette h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 0.04em; }
.blocks { display: grid; gap: 6px; }
@media (max-width: 780px) { .blocks { display: flex; overflow-x: auto; padding-bottom: 4px; } .blocks .pblock { flex: 0 0 auto; } }
.pblock { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 8px; text-align: left; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--module); cursor: grab; user-select: none; box-shadow: 0 1px 0 var(--shadow); }
.pblock:hover { border-color: var(--accent); }
.pblock .glyph { width: 26px; height: 26px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
.pblock .ptxt { display: grid; line-height: 1.2; min-width: 0; }
.pblock .ptxt small { color: var(--muted); font-size: 12px; }
.pgroup { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
@media (max-width: 780px) { .pgroup { display: none; } }
.lessons { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: lesson; }
.lessons li { counter-increment: lesson; }
.lessons button { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; text-align: left; border: 0; background: transparent; padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.lessons button::before { content: counter(lesson); font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 16px; text-align: center; }
.lessons button:hover { background: var(--panel); }
.ghost { position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; background: var(--accent); color: var(--accent-ink); border-radius: 4px; font-size: 13px; box-shadow: 0 6px 18px var(--shadow); }

/* ---------- Montageplatte */
.cabinet { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background-color: var(--plate);
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 18px 18px; padding: 16px; }
.cabinet-cols { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr) minmax(0, 0.85fr); gap: clamp(28px, 4vw, 64px); align-items: start; }
@media (max-width: 980px) { .cabinet-cols { grid-template-columns: minmax(0, 1fr); gap: 34px; } }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; min-width: 0; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 3px solid var(--rail); padding-bottom: 4px; }
.col-head h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.col-head span { color: var(--muted); font-size: 12px; }
.drop-hot { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 4px; }

.plant { min-width: 0; grid-template-columns: minmax(0, 1fr); border: 1px dashed var(--rail); border-radius: 5px; padding: 8px; display: grid; gap: 6px; background: color-mix(in srgb, var(--plate) 70%, transparent); }
.plant-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; cursor: pointer; }
.plant-head .pname { font-family: var(--font-mono); font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plant-head .ptype { color: var(--muted); font-size: 12px; white-space: nowrap; }
.plant.selected { border-color: var(--accent); border-style: solid; }
.gws { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

.module { position: relative; background: var(--module); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px 7px; display: grid; gap: 1px; cursor: pointer; box-shadow: 0 1px 0 var(--shadow); min-width: 0; text-align: left; }
.module::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 3px; background: repeating-linear-gradient(90deg, var(--rail) 0 6px, transparent 6px 11px); opacity: 0.7; }
.module:hover { border-color: var(--accent); }
.module.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.module .mtop { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 3px; }
.module .mkind { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.module .mname { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.module .msub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.module .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.flag { font-size: 11px; line-height: 1.4; padding: 0 5px; border-radius: 3px; background: var(--na-soft); color: var(--muted); white-space: nowrap; }
.flag.bad { background: var(--fail-soft); color: var(--fail); }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.led { width: 9px; height: 9px; border-radius: 50%; background: var(--na-soft); border: 1px solid var(--line); flex: none; }
.led.online { background: var(--pass); border-color: var(--pass); }
.led.rejected { background: var(--fail); border-color: var(--fail); }
.led.warn { background: var(--warn); border-color: var(--warn); }
.module.broker { padding: 12px 14px; gap: 4px; }
.module.broker .mname { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.02em; }
.slot-empty { border: 1px dashed var(--rail); border-radius: 4px; padding: 16px 12px; color: var(--muted); font-size: 13px; text-align: center; }
.add-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* Nachrichten-Token */
.token circle { stroke: var(--module); stroke-width: 2; }
.token text { font: 600 11px var(--font-mono); paint-order: stroke; stroke: var(--plate); stroke-width: 3px; }

/* ---------- Inspektor */
.inspector { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: 0.02em; }
.card p { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: 3px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field select, .field input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--module); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.actions { display: grid; gap: 10px; }
.agroup { display: grid; gap: 5px; }
.agroup .btns { display: flex; flex-wrap: wrap; gap: 5px; }
.note { font-size: 13px; color: var(--muted); }
.callout { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 7px 10px; border-radius: 0 4px 4px 0; font-size: 13.5px; }
.callout.info { border-color: var(--accent); background: var(--accent-soft); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.chip.PASS { background: var(--pass-soft); color: var(--pass); }
.chip.FAIL { background: var(--fail-soft); color: var(--fail); }
.chip.PARTIAL { background: var(--warn-soft); color: var(--warn); }
.chip.INCONCLUSIVE, .chip.NA, .chip.none { background: var(--na-soft); color: var(--na); }

.protocol .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.protocol .verdict strong { font-size: 16px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 22px 18px minmax(0, 1fr); gap: 6px; font-size: 13.5px; align-items: baseline; }
.steps li::before { content: counter(st); font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: right; }
.steps .ic { font-weight: 700; text-align: center; }
.steps .good .ic { color: var(--pass); } .steps .bad .ic { color: var(--fail); } .steps .warn .ic { color: var(--warn); } .steps .neutral .ic { color: var(--muted); }
.steps .pending { opacity: 0.45; }
.obs { font-family: var(--font-mono); font-size: 12.5px; background: var(--module); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; overflow-wrap: anywhere; }
.caserow { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; font-size: 13.5px; align-items: baseline; }

/* ---------- Pult */
.desk { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 16px; display: grid; gap: 12px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel { display: grid; gap: 12px; min-width: 0; }
.scroll-x { overflow-x: auto; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.cmp th, table.cmp td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.cmp th { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.03em; }
table.cmp td.req { min-width: 220px; }
table.cmp button.cell { border: 0; background: transparent; padding: 0; cursor: pointer; }
table.cmp tr.sel td { background: var(--accent-soft); }
pre.code { margin: 0; background: var(--module); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; font: 12.5px/1.5 var(--font-mono); overflow: auto; max-height: 420px; white-space: pre; }
.subtabs { display: flex; flex-wrap: wrap; gap: 5px; }
.subtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
.checklist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.checklist li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; }
.checklist .ok { color: var(--pass); font-weight: 700; } .checklist .no { color: var(--fail); font-weight: 700; } .checklist .hint { color: var(--warn); font-weight: 700; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px 20px; margin: 0; }
.gloss div { display: grid; gap: 2px; }
.gloss dt { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.gloss dd { margin: 0; font-size: 14px; color: var(--ink); max-width: 60ch; }
.inline-fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.inline-fields .field { min-width: 160px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 22px; height: 3px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">ENETEC · ENTC-63 Lab</span>
      <h1>MQTT-Baukasten</h1>
      <p class="datasource" id="datasource"></p>
    </div>
    <div class="controls">
      <span class="label-sm" id="wire-label">Topic-Schema</span>
      <div class="seg" role="radiogroup" aria-labelledby="wire-label" id="wire-seg">
        <button type="button" role="radio" data-wire="v13">v1.3 · state/cmd</button>
        <button type="button" role="radio" data-wire="lab-eicp">lab-eicp (alt)</button>
      </div>
      <button type="button" class="btn" id="btn-lab">Lab-Flotte laden</button>
      <button type="button" class="btn" id="btn-empty">Leer beginnen</button>
    </div>
  </header>

  <main class="workbench">
    <aside class="palette" aria-label="Bausteine">
      <div>
        <h2>Bausteine</h2>
        <p class="note">Ziehen oder antippen.</p>
      </div>
      <div class="blocks" id="palette"></div>
      <div>
        <h2>Lernpfad</h2>
        <p class="note">Jeder Schritt baut auf und löst ein Szenario aus.</p>
      </div>
      <ol class="lessons" id="lessons"></ol>
    </aside>

    <section class="cabinet" id="cabinet" aria-label="Aufbau">
      <svg id="wires" aria-hidden="true"></svg>
      <div class="cabinet-cols">
        <div class="col" id="col-field" data-drop="field">
          <div class="col-head"><h3>Feld</h3><span>Installationen · Gateways</span></div>
          <div id="plants" class="col"></div>
          <div class="add-row"><button type="button" class="btn small" id="add-plant">+ Installation</button></div>
        </div>
        <div class="col" id="col-broker" data-drop="broker">
          <div class="col-head"><h3>Broker</h3><span>MQTT 5 · mTLS</span></div>
          <div id="broker-slot"></div>
        </div>
        <div class="col" id="col-cloud" data-drop="cloud">
          <div class="col-head"><h3>Cloud</h3><span>Platzhalter für GCP</span></div>
          <div id="cloud-slot" class="col"></div>
        </div>
      </div>
    </section>

    <aside class="inspector" aria-label="Inspektor">
      <div class="card" id="inspect"></div>
      <div class="card protocol" id="protocol" aria-live="polite"></div>
    </aside>
  </main>

  <section class="desk" aria-label="Pult">
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="vergleich">Broker vergleichen</button>
      <button type="button" role="tab" data-tab="konfiguration">Konfiguration</button>
      <button type="button" role="tab" data-tab="export">Export in die Simulation</button>
      <button type="button" role="tab" data-tab="glossar">Glossar</button>
    </div>
    <div class="tabpanel" id="tabpanel" role="tabpanel"></div>

/* ---------- Verdrahtung (SVG) */
/* Leitung zwischen zwei Bausteinen: seitlich, wenn sie nebeneinander stehen, sonst oben/unten. */
function pathBetween(a, b) {
  const c = $("#cabinet").getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const side = ra.right <= rb.left || rb.right <= ra.left;
  if (side) {
    const right = ra.right <= rb.left;
    const ax = (right ? ra.right : ra.left) - c.left, bx = (right ? rb.left : rb.right) - c.left;
    const ay = ra.top - c.top + ra.height / 2, by = rb.top - c.top + Math.min(rb.height / 2, 40);
    const mx = (ax + bx) / 2;
    return `M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`;
  }
  const down = ra.bottom <= rb.top;
  const ax = ra.left - c.left + ra.width / 2, bx = rb.left - c.left + rb.width / 2;
  const ay = (down ? ra.bottom : ra.top) - c.top, by = (down ? rb.top : rb.bottom) - c.top;
  const my = (ay + by) / 2;
  return `M${ax},${ay} C${ax},${my} ${bx},${my} ${bx},${by}`;
}
const nodeEl = key => document.querySelector(`[data-node="${CSS.escape(key)}"]`);
function drawWires() {
  const svg = $("#wires"), broker = nodeEl("broker");
  const parts = [];
  if (broker) {
    for (const g of allGateways()) {
      const el = nodeEl("gw:" + g.id); if (!el) continue;
      const color = g.status === "rejected" ? "var(--fail)" : g.status === "warn" ? "var(--warn)" : "var(--wire-state)";
      const dash = g.status ? "" : ` stroke-dasharray="4 5"`;
      parts.push(`<path d="${pathBetween(el, broker)}" style="fill:none;stroke:${color}" stroke-width="${g.status ? 2 : 1.4}" opacity="${g.status ? 0.9 : 0.55}"${dash}/>`);
    }
    const ing = nodeEl("svc:ingest"); if (ing) parts.push(`<path d="${pathBetween(broker, ing)}" style="fill:none;stroke:var(--wire-state)" stroke-width="2.2" opacity="0.85"/>`);
    const cmd = nodeEl("svc:command"); if (cmd) parts.push(`<path d="${pathBetween(cmd, broker)}" style="fill:none;stroke:var(--wire-cmd)" stroke-width="2.2" opacity="0.85"/>`);
  }
  svg.innerHTML = parts.join("") + `<g id="tokens"></g>`;
}

  return pool.find(x => !own || !own.gateways.some(y => y.id === x.id)) || null;
}

/* =====================================================================
   Szenario-Engine: Testfall bestimmen, Ablauf bauen, animieren, erklären
   ===================================================================== */
const step = (from, to, label, tone = "neutral", extra = {}) => Object.assign({ from, to, label, tone }, extra);
const note = (label, tone = "neutral") => ({ note: true, label, tone });

function connectCase(gw) {
  if (gw.legacy) return "LEG-01";
  if (gw.cert !== "valid") return CERTS[gw.cert].connectCase;
  if (gw.cidMode === "foreign") return "ID-01";
  if (gw.cidMode === "cn" && state.wire === "v13") return "ID-03";
  return "MTLS-01";
}
/* Ist die Verbindung, über die eine Aktion läuft, überhaupt zustande gekommen? */
function gate(gw) {
  const c = connectCase(gw), r = resultFor(c);
  if (c === "MTLS-01" || c === "LEG-01") return { caseId: c, r, rejected: r.v === "FAIL" };
  if (r.v === "PASS") return { caseId: c, r, rejected: true };
  return { caseId: c, r, insecure: r.v === "FAIL" || r.v === "PARTIAL" };
}

function buildFlow(caseId, r, ctx) {
  const meta = CASE_DE[caseId] || { kind: "log" }, v = r.v, s = [];
  const T = ctx.gw ? topicsFor(ctx.gw) : null, tgtT = ctx.tgt ? topicsFor(ctx.tgt) : null;
  const deliverTo = (to, label, tone) => state.services.ingest || to !== "ingest" ? step("broker", to, label, tone) : note("Kein Cloud-Ingest eingebaut: Niemand sieht, ob zugestellt wird. Im Harness wäre das INCONCLUSIVE (Zeugen-Prinzip).", "warn");
  const blockedAt = (to, label, tone = "good") => to === "ingest" && !state.services.ingest
    ? note("Kein Cloud-Ingest eingebaut: Niemand sieht, ob zugestellt wird. Im Harness wäre das INCONCLUSIVE (Zeugen-Prinzip).", "warn")
    : step("broker", to, label, tone, { stop: true });
  const fromCmd = (label) => state.services.command ? step("command", "broker", label) : note("Kein Cloud-Command eingebaut: Der Harness nutzt ihn als berechtigten Sender. Hier gedanklich ergänzt.", "warn");
  switch (meta.kind) {
    case "connect-accept":
      s.push(step("gw", "broker", `TLS-Handshake mit ${caseId === "LEG-01" ? "AWS-Zertifikat ohne CN" : "eigenem Zertifikat"}, CONNECT als ${clientIdFor(ctx.gw)}`));
      if (v === "FAIL") s.push(step("gw", "broker", "Verbindung abgelehnt", "bad", { stop: true }));

    case "subscribe-allow":

    case "subscribe-deny": {

      s.push(step("gw", "broker", `SUBSCRIBE ${filt}`));

      else if (meta.source === "tgt" && ctx.tgt) s.push(step("tgt", "broker", `PUBLISH ${tgtT.up}`, "neutral", { wire: "state" }));
      else s.push(step("gw", "broker", `PUBLISH ${T.up}`, "neutral", { wire: "state" }));
      s.push(v === "FAIL" ? step("broker", "gw", "fremde Nachricht zugestellt", "bad") : step("broker", "gw", v ? "nichts zugestellt" : "erwartet: nichts zugestellt", v ? "good" : "neutral", { stop: true }));

    }
    case "unknown":
      s.push(step("gw", "broker", "Verbindung mit gültigem Zertifikat, Gateway nicht in der Registry"));
      if (v === "PASS") s.push(/rejected/.test(r.obs || "") ? step("gw", "broker", "Verbindung abgelehnt", "good", { stop: true }) : step("broker", "gw", "Publish und Subscribe abgelehnt", "good"));
      else if (v === "PARTIAL") { s.push(step("broker", "gw", "verbunden; Publish abgelehnt (PUBACK 0x87)", "good")); s.push(step("broker", "gw", "Abo bestätigt, aber nichts zugestellt (nicht gemeldet)", "warn")); }
      else if (v === "FAIL") s.push(step("broker", "gw", "Daten fließen ohne Registrierung", "bad"));
      else s.push(step("gw", "broker", "erwartet: abgelehnt oder ohne Rechte", "neutral", { stop: true }));
      break;
    case "dup":
      s.push(step("gw", "broker", `Gateway ist verbunden (${clientIdFor(ctx.gw)})`, "neutral"));
      s.push(step("gw", "broker", "zweite Verbindung mit derselben Client-ID"));
      if (v === "PASS") s.push(step("gw", "broker", "zweite Verbindung abgelehnt, bestehende Session bleibt", "good", { stop: true }));
      else if (v === "FAIL") s.push(step("broker", "gw", "Takeover: bestehende Session wird getrennt", "bad"));
      else s.push(step("gw", "broker", "erwartet: zweite Verbindung abgelehnt", "neutral", { stop: true }));
      break;
    case "offline": case "offline-clean":
      s.push(step("gw", "broker", `SUBSCRIBE ${T.downFilter} · Session Expiry > 0`, "neutral", { wire: "cmd" }));
      s.push(note("Netz weg: TCP bricht ohne DISCONNECT ab."));
      s.push(fromCmd("Command, während das Gateway offline ist"));
      s.push(note("Der Broker hält das Command in der Session."));
      if (meta.kind === "offline") {
        s.push(step("gw", "broker", "Reconnect mit Clean Start = false"));
        s.push(v === "FAIL" ? step("broker", "gw", "Session oder Command verloren", "bad", { stop: true }) : step("broker", "gw", v ? "session_present = 1, Command zugestellt" : "erwartet: Command zugestellt", v ? "good" : "neutral", { wire: "cmd" }));
      } else {
        s.push(step("gw", "broker", "Reconnect mit Clean Start = true (frischer Start)"));

      }

    case "expiry":

      s.push(note("Netz weg."));
      s.push(fromCmd("Command A mit Message Expiry 2 s, Command B ohne"));
      s.push(note("4 Sekunden später kommt das Gateway zurück."));
      s.push(step("gw", "broker", "Reconnect mit Clean Start = false"));
      s.push(v === "FAIL" ? step("broker", "gw", "abgelaufenes Command A trotzdem zugestellt", "bad", { wire: "cmd" }) : step("broker", "gw", v ? "nur B zugestellt, A verworfen" : "erwartet: nur B", v ? "good" : "neutral", { wire: "cmd" }));

    case "inflight":
      s.push(step("gw", "broker", `PUBLISH ${T.up} · QoS 1`, "neutral", { wire: "state" }));
      s.push(note("Der Link bricht ab, bevor der PUBACK ankommt."));
      s.push(step("gw", "broker", "Reconnect, Clean Start = false, erneutes Senden mit DUP-Flag", "neutral", { wire: "state" }));
      s.push(v === "FAIL" ? deliverTo("ingest", "Nachricht verloren", "bad") : deliverTo("ingest", v ? "zugestellt (Duplikat erlaubt)" : "erwartet: zugestellt", v ? "good" : "neutral"));
      break;
    case "will-allow":
      s.push(step("gw", "broker", `CONNECT mit Last Will auf ${T.up}`));
      s.push(note("Link bricht ab, ohne DISCONNECT."));
      s.push(v === "FAIL" ? deliverTo("ingest", "kein Last Will veröffentlicht", "bad") : deliverTo("ingest", v ? "Last Will veröffentlicht" : "erwartet: Last Will", v ? "good" : "neutral"));
      break;
    case "will-deny":
      s.push(step("gw", "broker", `CONNECT mit Last Will auf ${tgtT ? tgtT.up : "fremdes Topic"}`));
      if (v === "PASS" && /CONNECT/.test(r.obs || "")) { s.push(step("gw", "broker", "beim CONNECT abgelehnt", "good", { stop: true })); break; }
      s.push(note("Link bricht ab, ohne DISCONNECT."));
      s.push(v === "FAIL" ? deliverTo("ingest", "Last Will im fremden Topic veröffentlicht", "bad") : blockedAt("ingest", v ? "nicht veröffentlicht" : "erwartet: nicht veröffentlicht", v ? "good" : "neutral"));
      break;
    case "rotate": {
      const r1 = resultFor("ROT-01");
      s.push(step("gw", "broker", "Verbinden mit altem Zertifikat"));
      s.push(step("broker", "gw", r1.v === "FAIL" ? "abgelehnt" : "verbunden", r1.v === "FAIL" ? "bad" : r1.v ? "good" : "neutral"));
      s.push(step("gw", "broker", "Neues Zertifikat (CSR auf dem Gerät), altes trennen, neu verbinden"));
      s.push(step("broker", "gw", r1.v === "FAIL" ? "neues Zertifikat abgelehnt" : "verbunden mit neuem Zertifikat", r1.v === "FAIL" ? "bad" : r1.v ? "good" : "neutral"));

      s.push(v === "FAIL" ? step("broker", "gw", "Rückfall aufs alte Zertifikat klappt nicht", "bad") : step("broker", "gw", v ? "abgelehnt, Rückfall aufs alte klappt" : "erwartet: Rückfall klappt", v ? "good" : "neutral"));

    case "revoke":
      s.push(step("gw", "broker", "verbunden mit Zertifikat revoke-live"));

      if (v === "PASS") { s.push(step("broker", "gw", "offene Session beendet", "good")); s.push(step("gw", "broker", "neuer Verbindungsversuch abgelehnt", "good", { stop: true })); }
      else if (v === "PARTIAL") { s.push(step("broker", "gw", "offene Session läuft weiter", "warn")); s.push(step("gw", "broker", "neuer Verbindungsversuch abgelehnt", "good", { stop: true })); }
      else if (v === "FAIL") { s.push(step("broker", "gw", "offene Session läuft weiter", "bad")); s.push(step("broker", "gw", "neue Verbindung wird angenommen", "bad")); }
      else s.push(step("broker", "gw", "erwartet: Session beendet, neue Verbindung abgelehnt", "neutral"));
      break;
    case "withdraw":
      s.push(step("gw", "broker", `verbunden, abonniert ${T.downFilter}`, "neutral", { wire: "cmd" }));
      s.push(note("Die Rechte dieses Gateways werden entzogen (Hook acl-withdraw)."));
      s.push(step("gw", "broker", `PUBLISH ${T.up}`, "neutral", { wire: "state" }));
      if (v === "FAIL") s.push(deliverTo("ingest", "trotz Entzug zugestellt", "bad"));
      else s.push(blockedAt("ingest", v ? "nicht mehr zugestellt" : "erwartet: nicht zugestellt", v ? "good" : "neutral"));
      s.push(fromCmd("Command an das Gateway"));
      s.push(v === "PARTIAL" ? step("broker", "gw", "bestehendes Abo liefert weiter", "warn", { wire: "cmd" }) : v === "FAIL" ? step("broker", "gw", "bestehendes Abo liefert weiter", "bad", { wire: "cmd" }) : step("broker", "gw", v ? "bestehendes Abo liefert nichts mehr" : "erwartet: nichts", v ? "good" : "neutral", { stop: true }));
      break;
    case "restart":
      s.push(step("gw", "broker", "SUBSCRIBE cmd, dann DISCONNECT (Session bleibt)", "neutral", { wire: "cmd" }));
      s.push(fromCmd("Command, während das Gateway weg ist"));
      s.push(note("Der Broker startet neu (Hook restart)."));
      s.push(step("gw", "broker", "Reconnect, Clean Start = false"));
      s.push(v === "FAIL" ? step("broker", "gw", "Session nach dem Neustart weg, Command verloren", "bad", { stop: true }) : step("broker", "gw", v ? "Session und Command überstehen den Neustart" : "erwartet: Session bleibt", v ? "good" : "neutral", { wire: "cmd" }));
      break;
    case "storm":
      s.push(note("Alle Gateways verlieren gleichzeitig das Netz."));
      s.push({ storm: true, label: "Reconnect mit Jitter und exponentiellem Backoff", tone: "neutral" });
      s.push(note(v === "PASS" ? "Alle Sessions wieder da, Versuche über das Zeitfenster verteilt." : v === "FAIL" ? "Nicht alle Sessions kamen zurück oder die Versuche ballten sich." : "Erwartet: alle Sessions zurück, Versuche verteilt.", v === "PASS" ? "good" : v === "FAIL" ? "bad" : "neutral"));

    case "log":
      s.push(note("Der Harness sucht im Broker-Log des Laufzeitfensters nach Mustern aus dem Broker-Profil."));
      break;
  }
  return s;
}

/* Hauptablauf einer Aktion */
let running = false;
async function runAction(actionId, gwId) {
  if (running) return;
  const act = ACTIONS[actionId];
  // Broker-Aktionen brauchen ein Beispiel-Gateway (wie der Harness: Gateway A).
  const gw = gwId ? findGw(gwId) : act.broker ? (findGw("gw-sim-000001") || allGateways().find(g => !g.legacy) || null) : null;
  const blocked = actionBlocked(actionId, gw);
  if (blocked) { lastResult = { title: act.label, steps: [note(blocked, "warn")], primary: null }; renderProtocol(); return; }
  running = true;
  const ctx = { gw, tgt: act.target ? targetFor(gw, act.target) : null };
  if (gw && gw.cidMode === "foreign" && !ctx.tgt) ctx.tgt = foreignTarget(gw);
  let caseId, steps = [], notes = [], extra = [], gateStatus = null;

  if (actionId === "connect") {
    caseId = connectCase(gw);
    if (gw.cidMode === "foreign") ctx.tgt = foreignTarget(gw);
  } else if (actionId === "pub_own" && gw && gw.cidMode === "foreign") {
    caseId = "ID-02";
    notes.push("Unter v1.3 steckt die Client-ID im Topic: Mit fremder Client-ID ist das „eigene“ Topic das des anderen Gateways.");
  } else {
    caseId = (act.cases || ["ACL-01"])[0];
    extra = (act.cases || []).slice(1);
    if (actionId === "pub_own") extra = ["QOS-01"];
    if (gw && !act.broker) {
      const g = gate(gw);
      gateStatus = g.rejected ? "rejected" : g.insecure ? "warn" : "online";
      if (g.rejected) {
        const gr = g.r;
        steps = buildFlow(g.caseId, gr, ctx);
        steps.push(note("Ohne Verbindung findet die eigentliche Aktion nicht statt.", "neutral"));
        caseId = g.caseId; extra = [];
        notes.push(`Das Gateway kommt gar nicht erst rein (${CASE_DE[g.caseId].t}).`);
      } else if (g.insecure) {
        notes.push(`Achtung: Der Broker hat die Verbindung trotz „${CASE_DE[g.caseId].t}“ angenommen (${g.caseId} ${g.r.v}). Die folgende Aktion läuft also über eine Verbindung, die es nicht geben dürfte.`);
      }
    }
  }
  const r = resultFor(caseId);
  if (!steps.length) steps = buildFlow(caseId, r, ctx);
  if (gw) {
    const k = CASE_DE[caseId]?.kind;
    if (k === "connect-accept") gw.status = r.v === "FAIL" ? "rejected" : "online";
    else if (k === "connect-reject") gw.status = r.v === "PASS" ? "rejected" : r.v ? "warn" : null;
    else if (k === "revoke") gw.status = r.v === "PASS" ? "rejected" : "warn";
    else if (gateStatus) gw.status = gateStatus;
  }
  lastResult = { title: act.label + (gw ? ` · ${gw.id}` : ""), steps, primary: { caseId, r }, extra: extra.map(id => ({ caseId: id, r: resultFor(id) })), notes, ctx };
  renderPlants(); renderInspector(); drawWires(); renderProtocol(-1);
  await animate(steps, ctx);
  renderProtocol();
  save();
  running = false;
}

/* ---------- Animation */
function nodeFor(ref, ctx) {
  if (ref === "gw") return ctx.gw ? nodeEl("gw:" + ctx.gw.id) : null;
  if (ref === "tgt") return ctx.tgt ? nodeEl("gw:" + ctx.tgt.id) : null;
  if (ref === "broker") return nodeEl("broker");
  if (ref === "ingest") return nodeEl("svc:ingest");
  if (ref === "command") return nodeEl("svc:command");
  return null;
}
const toneColor = t => ({ good: "var(--pass)", bad: "var(--fail)", warn: "var(--warn)" }[t] || "var(--ink)");
async function flyToken(a, b, s) {
  const layer = $("#tokens"); if (!layer || !a || !b) return;
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", pathBetween(a, b)); p.setAttribute("fill", "none"); p.setAttribute("stroke", "none");
  layer.appendChild(p);
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "token");
  const color = s.wire === "cmd" ? "var(--wire-cmd)" : s.wire === "state" ? "var(--wire-state)" : toneColor(s.tone);
  g.innerHTML = `<circle r="7" style="fill:${color}"></circle>`;
  layer.appendChild(g);
  const len = p.getTotalLength(), end = s.stop ? len * 0.82 : len, dur = 650;
  const t0 = performance.now();
  await new Promise(res => {
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = p.getPointAtLength(end * e);
      g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
      k < 1 ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
  if (s.stop || s.tone === "bad" || s.tone === "good" || s.tone === "warn") {
    const pt = p.getPointAtLength(end);
    const mark = s.stop ? "✕" : s.tone === "good" ? "✓" : "!";
    g.innerHTML = `<circle r="9" style="fill:${toneColor(s.tone === "neutral" ? "warn" : s.tone)}"></circle><text x="0" y="4" text-anchor="middle" style="fill:var(--module);stroke:none;font-size:12px">${mark}</text>`;
    g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
    await sleep(420);
  }
  g.remove(); p.remove();
}
async function animate(steps, ctx) {
  for (let i = 0; i < steps.length; i++) {
    renderProtocol(i);
    const s = steps[i];
    if (REDUCED) continue;
    if (s.note) { await sleep(520); continue; }
    if (s.storm) {
      const gws = allGateways().filter(g => !g.legacy).slice(0, 10), broker = nodeEl("broker");
      await Promise.all(gws.map((g, k) => sleep(k * 130).then(() => flyToken(nodeEl("gw:" + g.id), broker, { tone: "neutral", wire: "state" }))));
      continue;
    }
    await flyToken(nodeFor(s.from, ctx), nodeFor(s.to, ctx), s);
  }
}

/* ---------- Prüfprotokoll */
const ICON = { good: "✓", bad: "✕", warn: "!", neutral: "•" };

  const title = state.wire !== "v13" && de.tLab ? de.tLab : (de.t || meta.title);
  const src = r.run ? `${r.run.label} · ${fmtDate(r.run.date)} · Profil ${r.run.wire}${r.fallback ? " (kein Lauf im gewählten Profil)" : ""}` : "";
  return `<div class="agroup">
    <div class="verdict"><span class="chip ${chipCls}">${esc(VERDICT_DE[v] || v)}</span><strong>${esc(caseId)}</strong><span>${esc(title)}</span></div>
    ${primary && de.why ? `<p>${esc(de.why)}</p>` : ""}
    <div class="caserow"><span class="note">Anforderung</span><span>${esc(meta.req)} · ${esc(REQ_DE[meta.req] || "")} · ${meta.mandatory ? "Pflicht" : "beratend"}</span>
    ${src ? `<span class="note">Quelle</span><span>${esc(src)}</span>` : ""}</div>
    ${r.obs ? `<div><span class="note">Im Lab beobachtet</span><div class="obs">${esc(r.obs)}</div></div>` : r.v ? `<p class="note">Aus diesem Lauf liegt nur das Ergebnis vor, keine Einzelbeobachtung.</p>` : `<p class="note">${esc(r.reason || "Nicht gemessen.")} Messen mit: make acceptance BROKER=${esc(state.broker || "…")}</p>`}
  </div>`;
}
function renderProtocol(activeIdx) {
  const box = $("#protocol");
  if (!lastResult) {
    box.innerHTML = `<h2>Prüfprotokoll</h2><p class="note">Wähle ein Gateway und löse eine Aktion aus, oder starte einen Schritt im Lernpfad. Hier erscheint dann der Ablauf mit dem Ergebnis aus dem Lab.</p>`;
    return;
  }
  const R = lastResult, done = activeIdx === undefined;
  const stepsHtml = R.steps.map((s, i) => `<li class="${s.tone}${!done && i > activeIdx ? " pending" : ""}"><span class="ic">${ICON[s.tone] || "•"}</span><span>${s.note || s.storm ? esc(s.label) : `<span class="note">${esc(nodeName(s.from, R.ctx))} → ${esc(nodeName(s.to, R.ctx))}:</span> ${esc(s.label)}`}</span></li>`).join("");
  box.innerHTML = `<h2>Prüfprotokoll</h2>
    <div class="label-sm">${esc(R.title)}</div>
    <ol class="steps">${stepsHtml}</ol>
    ${(R.notes || []).map(n => `<div class="callout">${esc(n)}</div>`).join("")}
    ${done && R.primary ? caseBlock(R.primary, true) + (R.extra || []).map(e => caseBlock(e, false)).join("") : ""}`;

function aggregate(run, reqId) {

  if (!res.length) return { v: "none", advisory: false, list: [] };

}

let drag = null;
function onPalettePointerDown(e) {

function dropZoneAt(x, y, item) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const plant = el.closest("[data-drop='plant']"), col = el.closest("[data-drop]:not([data-drop='plant'])");
  if (plant && canDrop(item, "plant")) return { el: plant, zone: "plant", plant: plant.dataset.plant };
  if (col && canDrop(item, col.dataset.drop)) return { el: col, zone: col.dataset.drop };

document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  if (!drag.moved) { drag.moved = true; drag.ghost = Object.assign(document.createElement("div"), { className: "ghost", textContent: drag.item.label }); document.body.appendChild(drag.ghost); }
  drag.ghost.style.left = (e.clientX + 12) + "px"; drag.ghost.style.top = (e.clientY + 12) + "px";
  document.querySelectorAll(".drop-hot").forEach(x => x.classList.remove("drop-hot"));
  const z = dropZoneAt(e.clientX, e.clientY, drag.item); if (z) z.el.classList.add("drop-hot");

document.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll(".drop-hot").forEach(x => x.classList.remove("drop-hot"));
  if (d.ghost) d.ghost.remove();
  if (!d.moved) return;   // ein Klick wird vom click-Handler behandelt
  const z = dropZoneAt(e.clientX, e.clientY, d.item);

  const cfg = t.closest("[data-config]"); if (cfg) { state.configView = cfg.dataset.config; renderDesk(); save(); return; }
  const cp = t.closest("[data-copy]"); if (cp) { copyFrom(cp.dataset.copy, cp); return; }
  const wb = t.closest("[data-wire]"); if (wb) { state.wire = wb.dataset.wire; allGateways().forEach(g => { g.status = null; if (state.wire !== "v13" && g.cidMode === "cn") g.cidMode = "own"; }); lastResult = null; renderAll(); save(); return; }
  if (t.closest("#btn-lab")) { state = labState(); lastResult = null; renderAll(); save(); return; }
  if (t.closest("#btn-empty")) { state = emptyState(); lastResult = null; renderAll(); save(); return; }
  if (t.closest("#add-plant")) { addPlant(); renderAll(); save(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-gw-field]") && state.selected?.kind === "gateway") {
    const g = findGw(state.selected.id); if (!g) return;
    const field = t.dataset.gwField;
    if (field === "id") {
      const v = t.value.trim(), ok = g.legacy ? /^\d{16}$/.test(v) : /^gw-sim-\d{6}$/.test(v);
      if (!ok || (v !== g.id && findGw(v))) { t.value = g.id; lastResult = { title: "Gateway-ID", steps: [note(g.legacy ? "Legacy-IDs haben 16 Ziffern." : "Gateway-IDs haben das Format gw-sim-NNNNNN und sind eindeutig.", "warn")], primary: null }; renderProtocol(); return; }
      g.id = v; state.selected.id = v;
    } else if (field === "serial") {
      const v = t.value.trim(), n = Number(v);
      const taken = allGateways().some(x => x !== g && !x.legacy && x.serial === v);
      if (!/^\d{1,10}$/.test(v) || n < 1 || n > 4294967295 || taken) { t.value = g.serial; lastResult = { title: "Seriennummer", steps: [note(taken ? "Diese Seriennummer hat schon ein anderes Gateway." : "Seriennummern sind ganze Zahlen von 1 bis 4294967295 (32 Bit).", "warn")], primary: null }; renderProtocol(); return; }
      g.serial = String(n); g.sample = true;
    } else g[field] = t.value;
    g.status = null; renderAll(); save(); return;
  }
  if (t.id === "f-broker") { state.broker = t.value; allGateways().forEach(g => { g.status = null; }); lastResult = null; renderAll(); save(); return; }
  if (t.id === "t-d2c" || t.id === "t-cmd") { const n = Number(t.value); if (Number.isFinite(n) && n >= 0) state.traffic[t.id === "t-d2c" ? "d2c" : "cmd"] = n; renderDesk(); save(); return; }
  if (t.matches("[data-incident]")) { const set = new Set(state.traffic.incidents || []); t.checked ? set.add(t.dataset.incident) : set.delete(t.dataset.incident); state.traffic.incidents = [...set]; renderDesk(); save(); }
});
document.getElementById("palette").addEventListener("pointerdown", onPalettePointerDown);
async function copyFrom(id, btn) {
  const el = document.getElementById(id); if (!el) return;
  const text = el.textContent, old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Kopiert"; }
  catch (e) { const range = document.createRange(); range.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); btn.textContent = "Markiert: mit Strg/Cmd+C kopieren"; }
  setTimeout(() => { btn.textContent = old; }, 1800);
}

   Start
   ===================================================================== */
function renderHeader() {
  document.querySelectorAll("#wire-seg [data-wire]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.wire === state.wire)));
  const runs = (DATA.runs || []).length;
  $("#datasource").textContent = DATA.generated_utc
    ? `Lab-Version ${DATA.lab_version || "?"} · ${runs} Referenzläufe aus docs/mqtt-tests/reference · Daten vom ${fmtDate(DATA.generated_utc)}. Broker-Verhalten nur so, wie es im Lab gemessen wurde.`
    : "Keine Lab-Daten eingebaut: im Lab-Ordner make web ausführen.";
}
function renderAll() {
  renderHeader(); renderPlants(); renderBroker(); renderCloud(); renderInspector(); renderProtocol(); renderDesk();
  requestAnimationFrame(drawWires);
}
renderPalette(); renderLessons(); renderAll();
if (["vergleich", "konfiguration", "export", "glossar"].includes(location.hash.slice(1))) setTab(location.hash.slice(1));
new ResizeObserver(() => drawWires()).observe(document.getElementById("cabinet"));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWires);
</script>
