## EMQX 5.8 configuration for the ENETEC mTLS lab (ENTC-59 / ENTC-63).
## Mounted as /opt/emqx/etc/emqx.conf by docker-compose.yml (service "emqx").
## Synthetic lab identities only - never use the lab CA or keys in production.

node {
  name = "emqx@127.0.0.1"
  cookie = "enetec-lab-only"
  data_dir = "data"
}

cluster {
  name = enetec-lab
  discovery_strategy = manual
}

## --- Listeners --------------------------------------------------------------
## Only mTLS: plain TCP and WebSocket listeners are switched off.
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 20000
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/lab/ca/ca.crt"          # lab CA: trusted issuer of client certs
    certfile   = "/opt/emqx/etc/certs/lab/broker/broker.crt"  # SAN: broker, localhost, emqx, 127.0.0.1
    keyfile    = "/opt/emqx/etc/certs/lab/broker/broker.key"
    verify = verify_peer                             # client certificate required ...
    fail_if_no_peer_cert = true                      # ... connection without one is rejected
    versions = ["tlsv1.3", "tlsv1.2"]
    ## Revocation (MTLS-08): EMQX checks CRLs from the certificates' CRL Distribution
    ## Point (HTTP). The lab certificates carry none, so MTLS-08 stays FAIL here.
    # enable_crl_check = true
  }
}

## --- Identity ---------------------------------------------------------------
## Certificate CN becomes the MQTT username; the ACL below is keyed on it.
mqtt {
  peer_cert_as_username = cn
  ## Alternative: force Client ID = CN. EMQX then REPLACES the client's Client ID instead
  ## of rejecting a mismatch (ID-01 stays FAIL, but no foreign session is displaced).
  # peer_cert_as_clientid = cn
  session_expiry_interval = 2h
  max_packet_size = 1MB
}

## --- Authorization (deny by default) -------------------------------------------
authorization {
  no_match = deny
  deny_action = ignore   # MQTT 5: PUBACK/SUBACK 0x87; "disconnect" would drop the client
  cache { enable = false }  # ACL changes take effect immediately (test 10 style)
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
  ]
}

## --- Logging (audit evidence via docker compose logs emqx) ------------------------
log {
  console { enable = true, level = info }
  file.default { enable = false }
}

## --- Dashboard (local lab only) ------------------------------------------------
dashboard.listeners.http.bind = 18083
