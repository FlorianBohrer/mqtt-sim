## EMQX 5.8 with registry authentication: lab prototype for R06 (Client ID bound to the
## certificate) and R11 (no silent takeover by a second connection). make acceptance BROKER=emqx-registry
## Everything from brokers/emqx/emqx.conf (included below), plus an HTTP authenticator that asks the
## lab registry (brokers/registry/registry.py) on every CONNECT. Synthetic lab identities only.
include "/opt/emqx/etc/emqx-base.conf"

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://registry:8080/auth"
    headers { "content-type" = "application/json" }
    body {
      clientid = "${clientid}"
      username = "${username}"
      cn = "${cert_common_name}"
    }
    ## the registry may wait up to DUPLICATE_GRACE_S for a dropped old connection to disappear
    request_timeout = "10s"
    connect_timeout = "5s"
    pool_size = 8
  }
]

## REST API key for the registry's duplicate check (GET /api/v5/clients/{clientid}).
## Written by scripts/19_emqx_registry.sh into certs/ (not in Git).
api_key.bootstrap_file = "/opt/emqx/etc/certs/lab/emqx-registry/api_key.txt"
