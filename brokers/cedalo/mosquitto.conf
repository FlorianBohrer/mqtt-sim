# Pro Mosquitto (Cedalo) for the ENTC-63 harness: make acceptance BROKER=cedalo
# Same listener and identity model as the lab Mosquitto (mosquitto/config/mosquitto.conf), plus a CRL.
# Pro Mosquitto is built on Eclipse Mosquitto and reads the same options (Cedalo); Pro-only plugins
# (persistence, audit trail, Dynamic Security, Pub/Sub bridge) are NOT enabled here: their plugin
# paths and options are OPEN until checked against docs.cedalo.com, see brokers/cedalo/README.md.

listener 8883
protocol mqtt

allow_anonymous false
require_certificate true
cafile /mosquitto/certs/ca/ca.crt

certfile /mosquitto/certs/broker/broker.crt
keyfile /mosquitto/certs/broker/broker.key
tls_version tlsv1.2

# Revocation (MTLS-08, REV-01): CRL of the lab CA, rewritten by scripts/17_revoke_live.sh and
# re-read on SIGHUP (profile [hooks] crl_reload = "hup"). If every client is rejected after this
# line, the CRL does not match the CA: see the troubleshooting section of the README.
crlfile /mosquitto/certs/negative/crl.pem

# Certificate CN becomes the MQTT username; the ACL is the one make fleet generates for Mosquitto.
use_identity_as_username true
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
connection_messages true
