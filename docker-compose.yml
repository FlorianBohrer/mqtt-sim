services:
  broker:
    image: eclipse-mosquitto:2
    container_name: enetec-mqtt-broker
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - ./data:/mosquitto/data
      - ./logs:/mosquitto/log

  client:
    image: eclipse-mosquitto:2
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./certs:/certs:ro
      - ./samples:/samples:ro

  # EMQX 5 as ENTC-59 candidate: make acceptance BROKER=emqx (brokers/emqx/README.md).
  # Same lab CA, certificates and fleet ACL as the Mosquitto broker.
  emqx:
    image: emqx/emqx:5.8.6
    container_name: enetec-emqx
    profiles: ["emqx"]
    ports:
      - "8884:8883"     # mTLS (Mac: localhost:8884, compose network: emqx:8883)
      - "18083:18083"   # dashboard (admin / public, local lab only)
    volumes:
      - ./brokers/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./brokers/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./certs:/opt/emqx/etc/certs/lab:ro

  # EMQX with registry authentication (lab prototype for R06/R11): make acceptance BROKER=emqx-registry.
  # Same EMQX configuration as above (included as emqx-base.conf) plus an HTTP authenticator that asks
  # the registry service below on every CONNECT. See brokers/emqx-registry/ and brokers/registry/.
  emqx-registry:
    image: emqx/emqx:5.8.6
    container_name: enetec-emqx-registry
    profiles: ["emqx-registry"]
    depends_on: [registry]
    ports:
      - "8886:8883"     # mTLS (host: localhost:8886, compose network: emqx-registry:8883)
    volumes:
      - ./brokers/emqx/emqx.conf:/opt/emqx/etc/emqx-base.conf:ro
      - ./brokers/emqx-registry/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./brokers/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./certs:/opt/emqx/etc/certs/lab:ro

  # Lab registry: certificate CN -> authorised Client ID (synthetic/fleet.json), duplicate check via
  # the EMQX REST API. Standard library only; reachable inside the compose network only.
  registry:
    image: python:3.12-alpine
    container_name: enetec-registry
    profiles: ["emqx-registry"]
    command: ["python", "-u", "/app/registry.py"]
    environment:
      FLEET: /lab/synthetic/fleet.json
      EMQX_API: http://emqx-registry:18083/api/v5
      EMQX_API_KEY_FILE: /lab/certs/emqx-registry/api_key.txt
      DUPLICATE_GRACE_S: "3"
    volumes:
      - ./brokers/registry:/app:ro
      - ./synthetic:/lab/synthetic:ro
      - ./certs/emqx-registry:/lab/certs/emqx-registry:ro

  # Pro Mosquitto (Cedalo) as ENTC-59 candidate: make acceptance BROKER=cedalo (brokers/cedalo/README.md).
  # Needs `docker login registry.cedalo.com` and a licence file in brokers/cedalo/license/ (30-day
  # on-premises trial). Same lab CA, certificates and generated Mosquitto ACL as the lab broker.
  # OPEN: current image tag. 2.9 is the newest tag seen in Cedalo's examples; set CEDALO_IMAGE to
  # the tag shown in your Cedalo account.
  cedalo:
    image: ${CEDALO_IMAGE:-registry.cedalo.com/mosquitto/mosquitto:2.9}
    container_name: enetec-cedalo
    profiles: ["cedalo"]
    environment:
      CEDALO_LICENSE_FILE: /mosquitto/license/license.lic
    ports:
      - "8885:8883"     # mTLS (Mac: localhost:8885, compose network: cedalo:8883)
    volumes:
      - ./brokers/cedalo/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
      - ./brokers/cedalo/license:/mosquitto/license:ro

  # Synthetic fleet / simulation runtime (python -m enetec_sim), see docs/mqtt-tests/.
  sim:
    # Built locally by scripts/sim_common.sh (docker build -t enetec-sim:local sim),
    # never pulled from a registry.
    image: enetec-sim:local
    pull_policy: never
    profiles: ["sim"]
    environment:
      # Empty = take host/port from the broker profile (sim/targets/<BROKER>.toml).
      SIM_BROKER_HOST: ${SIM_BROKER_HOST:-}
      SIM_BROKER_PORT: ${SIM_BROKER_PORT:-}
      SIM_IN_CONTAINER: "1"
      SIM_WIRE: ${SIM_WIRE:-}     # v13 | lab-eicp (make ... WIRE=...); empty: sim/config.toml [wire]
      SIM_HOOKS: ${SIM_HOOKS:-}   # 1 while scripts/13_acceptance.sh answers hook requests
    extra_hosts:
      - "host.docker.internal:host-gateway"   # brokers running on the Mac itself
    volumes:
      - ./:/lab
